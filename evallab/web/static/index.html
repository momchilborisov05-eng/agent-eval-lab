<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Eval Lab</title>
  <meta name="color-scheme" content="dark light">
  <script>
    // Resolve the theme before first paint: ?theme=light|dark, then the saved choice, then dark.
    (function () {
      var t = null;
      try { var q = new URLSearchParams(location.search).get("theme"); if (q === "light" || q === "dark") t = q; } catch (e) {}
      if (!t) { try { var s = localStorage.getItem("evallab-theme"); if (s === "light" || s === "dark") t = s; } catch (e) {} }
      document.documentElement.setAttribute("data-theme", t || "dark");
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"><span class="glow g1"></span><span class="glow g2"></span></div>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="Agent Eval Lab home">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6.5L4.6 18.2A1.8 1.8 0 0 0 6.1 21h11.8a1.8 1.8 0 0 0 1.5-2.8L14 9.5V3"/><path d="M7.5 15h9"/></svg>
        </span>
        <span class="brand-text"><strong>Agent Eval Lab</strong><small>simulate &middot; test &middot; judge &middot; monitor</small></span>
      </a>
      <nav id="main-nav" aria-label="Main">
        <a href="#/" data-nav="overview">Overview</a>
        <a href="#/compare" data-nav="compare">Compare runs</a>
        <a href="#/gtm" data-nav="gtm">GTM insights</a>
        <a href="/docs" target="_blank" rel="noopener">API <svg class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg></a>
      </nav>
      <div class="topbar-actions">
        <span id="demo-badge" class="demo-badge" hidden title="Runs use the offline demo agent, customer and judge"><span class="dot"></span>Demo data</span>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle colour theme" title="Toggle theme">
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <button id="nav-toggle" class="icon-btn nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="main-nav">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="shell">
    <div id="banner" class="banner" hidden></div>
    <main id="app" aria-live="polite">
      <div class="skeleton-page" aria-label="Loading">
        <div class="sk sk-title"></div>
        <div class="kpis"><div class="sk sk-kpi"></div><div class="sk sk-kpi"></div><div class="sk sk-kpi"></div><div class="sk sk-kpi"></div></div>
        <div class="grid g2"><div class="sk sk-card"></div><div class="sk sk-card"></div></div>
      </div>
    </main>
    <footer class="foot">Agent Eval Lab &middot; FastAPI + SQLite + Chart.js &middot; <a href="/docs" target="_blank" rel="noopener">OpenAPI docs</a></footer>
  </div>

  <div id="sql-modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="sql-title">
      <div class="modal-head">
        <div class="modal-title"><span class="sql-tag">SQL</span><strong id="sql-title">SQL</strong></div>
        <div class="modal-actions">
          <button id="sql-copy" class="btn btn-secondary btn-sm" type="button">Copy</button>
          <button id="sql-close" class="icon-btn" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
      <pre id="sql-body"></pre>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
